services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: kiosk
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      # 호스트 5432 는 무관한 postgres 컨테이너가 이미 점유 중이라 5433 으로 매핑.
      # 컨테이너 내부 포트는 5432 그대로이므로 compose 내 backend 의 db:5432 연결은 영향 없음.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    image: ${DOCKER_USERNAME}/kiosk-backend:latest
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kiosk
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # 컨테이너 내부는 8080 유지(아래 8080:8080 매핑과 일치). 로컬 gradle 실행 기본값은 8093.
      SERVER_PORT: 8080
      ERP_DATASOURCE_URL: jdbc:sqlserver://mssql:1433;databaseName=DR_ERP;trustServerCertificate=true
      ERP_DATASOURCE_USERNAME: sa
      ERP_DATASOURCE_PASSWORD: ${ERP_DATASOURCE_PASSWORD:-Erp_Local_2026!}
      # 업로드 이미지 저장소(MinIO). 시크릿은 .env 에서 주입(커밋 금지).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://192.168.0.90:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-kiosk}
      # 1회성 마이그레이션: /app/uploads 지정 후 1회 배포, 완료되면 비우고 재배포.
      MINIO_MIGRATE_LOCAL_DIR: ${MINIO_MIGRATE_LOCAL_DIR:-}
    ports:
      - "8080:8080"
    volumes:
      # 기존 이미지 마이그레이션 원본. 마이그레이션 완료 후에는 제거해도 됨.
      - kiosk_uploads:/app/uploads
      # 관리자 화면에서 올린 ERP 백업(.bak) 을 놓는 곳. RESTORE 는 SQL Server 자기 파일시스템의
      # 파일만 읽어서, mssql 의 데이터 볼륨을 그대로 물려 import/ 하위에만 쓴다.
      # (mssql 쪽 마운트는 건드리지 않으므로 이 기능 때문에 DB 컨테이너를 재생성할 필요가 없다.)
      - mssql_data:/var/opt/mssql

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      # MSSQL 은 강한 SA 비밀번호를 요구한다(8자+ 복잡도). .env 의 MSSQL_SA_PASSWORD 사용.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Erp_Local_2026!}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  postgres_data:
  kiosk_uploads:
  mssql_data:
