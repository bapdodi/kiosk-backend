name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 앱 기동 테스트(DemoApplicationTests)가 빈 DB 에 Flyway 마이그레이션을 전부 적용하고
    # 엔티티와 스키마를 대조한다. 여기서 깨지면 watchtower 가 운영을 교체하기 전에 멈춘다.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: kiosk
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d kiosk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # *IT 는 전용 환경변수가 없으면 스스로 건너뛴다. ERP·MinIO 는 기동 때 연결 실패를 경고로만
      # 남기므로 바로 거절되는 주소로 둔다(기본값인 사설 IP 는 러너에서 응답 없이 오래 매달린다).
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kiosk
        MINIO_ENDPOINT: http://127.0.0.1:1
        MINIO_ACCESS_KEY: ci
        MINIO_SECRET_KEY: ci-dummy-secret
        ERP_DATASOURCE_URL: jdbc:sqlserver://127.0.0.1:1;databaseName=DR_ERP;trustServerCertificate=true
      run: ./gradlew test bootJar

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ secrets.DOCKER_USERNAME }}/kiosk-backend:latest,${{ secrets.DOCKER_USERNAME }}/kiosk-backend:${{ github.sha }}

  # 배포(deploy)는 운영서버의 watchtower 가 담당한다.
  # watchtower 가 Docker Hub 의 새 :latest 이미지를 감지해 컨테이너를 교체하므로
  # 여기서 docker compose 로 배포하지 않는다. (과거 deploy 잡은 .env 를 덮어써
  # 운영 비밀값을 날릴 위험이 있어 제거함)
