name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew test --tests com.example.demo.controller.VisionErpSalesControllerTest bootJar

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ secrets.DOCKER_USERNAME }}/kiosk-backend:latest,${{ secrets.DOCKER_USERNAME }}/kiosk-backend:${{ github.sha }}

  # 배포(deploy)는 운영서버의 watchtower 가 담당한다.
  # watchtower 가 Docker Hub 의 새 :latest 이미지를 감지해 컨테이너를 교체하므로
  # 여기서 docker compose 로 배포하지 않는다. (과거 deploy 잡은 .env 를 덮어써
  # 운영 비밀값을 날릴 위험이 있어 제거함)
