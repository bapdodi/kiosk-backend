spring:
  datasource:
    # 로컬 docker-compose 의 db 서비스 (호스트 5433 → 컨테이너 5432). 원격은 43.201.18.30:5432 였음.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kiosk}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      # ERP 백업(.bak)은 수백 MB 라 기본 1MB 제한으로는 업로드가 막힌다.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:2GB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:2GB}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  # 기본값 8080. 로컬에서 8080 이 점유된 경우 .env 의 SERVER_PORT 로 override (예: 8093).
  port: ${SERVER_PORT:8080}

# 업로드 이미지 저장소(MinIO / S3 호환). 값은 backend/.env 또는 docker-compose 로 주입한다.
# 객체 키 = 파일명, 서빙 URL 은 기존과 동일하게 /uploads/<파일명> 을 백엔드가 MinIO 에서 프록시한다.
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://192.168.0.90:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    # 시크릿은 git 에 커밋하지 않는다. .env(gitignore) 또는 배포 환경변수로만 주입.
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:kiosk}
    # 1회성 마이그레이션: 지정 시 부팅 때 이 로컬 디렉터리의 파일을 MinIO 로 업로드한다(누락분만).
    # 운영 컨테이너에서는 /app/uploads 로 지정. 마이그레이션 완료 후 값을 비워 재배포.
    migrate-local-dir: ${MINIO_MIGRATE_LOCAL_DIR:}

# 모니터링 — oracle-arm의 Prometheus가 tailnet으로 /actuator/prometheus를 스크레이프한다.
# health/info/prometheus만 노출하고, env·heapdump 등 민감 엔드포인트는 열지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never   # 인증 없이 열리는 엔드포인트라 상세는 숨긴다
  metrics:
    tags:
      application: kiosk    # 모든 메트릭에 application="kiosk" 라벨을 붙여 Grafana에서 구분

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG

erp:
  datasource:
    # 로컬 docker-compose mssql 서비스 (호스트 1433). 원격은 43.201.18.30:1433 였음.
    url: ${ERP_DATASOURCE_URL:${ERP_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DR_ERP;trustServerCertificate=true}}
    username: ${ERP_DATASOURCE_USERNAME:${ERP_DB_USERNAME:sa}}
    password: ${ERP_DATASOURCE_PASSWORD:${ERP_DB_PASSWORD:Erp_Local_2026!}}
  # 관리자 화면의 ERP 백업(.bak) 반영 기능.
  # RESTORE 는 SQL Server 자기 파일시스템의 파일만 읽어서, 백엔드가 MSSQL 데이터 볼륨을 같이 물고
  # import/ 하위에 .bak 을 놓는다. 그래서 두 값이 같은 경로다(mssql 컨테이너는 손대지 않아도 된다).
  # 호스트에서 gradle 로 띄울 때만 upload-dir 을 각자의 실제 경로로 덮어쓴다.
  bak-import:
    staging-db: ${ERP_BAK_STAGING_DB:DR_ERP_STAGING}
    upload-dir: ${ERP_BAK_UPLOAD_DIR:/var/opt/mssql/import}
    mssql-dir: ${ERP_BAK_MSSQL_DIR:/var/opt/mssql/import}

# 동시구매 추천. ERP 거래이력(ILxx)을 야간에 집계해 reco_item_pair 에 적재한다.
recommendation:
  years: 2                # 집계 대상 연도 수 (2 = 올해 + 작년)
  min-co-count: 3         # 이 횟수 미만 동시구매는 우연으로 보고 버린다
  max-per-item: 20        # 상품당 보관할 추천 후보 상한
  cache-ttl-ms: 300000    # 메모리 스냅샷 수명
  cron: "0 30 3 * * *"    # 야간 재집계 시각

# 네이버 커머스API(스마트스토어) 연동. 값은 backend/.env 로 주입한다. (미설정 시 연동 기능만 비활성)
naver:
  commerce:
    client-id: ${NAVER_COMMERCE_CLIENT_ID:}
    client-secret: ${NAVER_COMMERCE_CLIENT_SECRET:}
    base-url: ${NAVER_COMMERCE_BASE_URL:https://api.commerce.naver.com/external}
    shipping-address-id: ${NAVER_SHIPPING_ADDRESS_ID:}
    return-address-id: ${NAVER_RETURN_ADDRESS_ID:}
    as-telephone: ${NAVER_AS_TELEPHONE:}
    as-guide-content: ${NAVER_AS_GUIDE_CONTENT:구매하신 매장으로 문의 바랍니다.}
    origin-area-code: ${NAVER_ORIGIN_AREA_CODE:}
    brand-name: ${NAVER_BRAND_NAME:자체제작}
    manufacturer-name: ${NAVER_MANUFACTURER_NAME:자체제작}
    delivery-company: ${NAVER_DELIVERY_COMPANY:}
    register-as-suspended: ${NAVER_REGISTER_AS_SUSPENDED:true}
    delivery-base-fee: ${NAVER_DELIVERY_BASE_FEE:3000}
    return-delivery-fee: ${NAVER_RETURN_DELIVERY_FEE:3000}
    exchange-delivery-fee: ${NAVER_EXCHANGE_DELIVERY_FEE:6000}