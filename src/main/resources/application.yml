spring:
  datasource:
    # 로컬 docker-compose 의 db 서비스 (호스트 5433 → 컨테이너 5432). 원격은 43.201.18.30:5432 였음.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kiosk}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  # 기본값 8080. 로컬에서 8080 이 점유된 경우 .env 의 SERVER_PORT 로 override (예: 8093).
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG

erp:
  datasource:
    # 로컬 docker-compose mssql 서비스 (호스트 1433). 원격은 43.201.18.30:1433 였음.
    url: ${ERP_DATASOURCE_URL:${ERP_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DR_ERP;trustServerCertificate=true}}
    username: ${ERP_DATASOURCE_USERNAME:${ERP_DB_USERNAME:sa}}
    password: ${ERP_DATASOURCE_PASSWORD:${ERP_DB_PASSWORD:Erp_Local_2026!}}

# 네이버 커머스API(스마트스토어) 연동. 값은 backend/.env 로 주입한다. (미설정 시 연동 기능만 비활성)
naver:
  commerce:
    client-id: ${NAVER_COMMERCE_CLIENT_ID:}
    client-secret: ${NAVER_COMMERCE_CLIENT_SECRET:}
    base-url: ${NAVER_COMMERCE_BASE_URL:https://api.commerce.naver.com/external}
    shipping-address-id: ${NAVER_SHIPPING_ADDRESS_ID:}
    return-address-id: ${NAVER_RETURN_ADDRESS_ID:}
    as-telephone: ${NAVER_AS_TELEPHONE:}
    as-guide-content: ${NAVER_AS_GUIDE_CONTENT:구매하신 매장으로 문의 바랍니다.}
    origin-area-code: ${NAVER_ORIGIN_AREA_CODE:}
    delivery-base-fee: ${NAVER_DELIVERY_BASE_FEE:3000}
    return-delivery-fee: ${NAVER_RETURN_DELIVERY_FEE:3000}
    exchange-delivery-fee: ${NAVER_EXCHANGE_DELIVERY_FEE:6000}